<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nota</title>
    <style>
      table {
        border-collapse: collapse;
        width: 50%;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #ddd;
        text-align: center;
      }

    </style>
  </head>
  <body>
    <table>
      <tr>
        <th>Materia</th>
        <th>Nota</th>
      </tr>
      {% for materia, nota in notas.items() %}
      <tr>
        <td>{{materia}}</td>
        <td>{{nota}}</td>
      </tr>
      {% endfor %}
      <tr>
        <td>Nota Alta</td>
        <td>{{nota_alta}}</td>
      </tr>
      <tr>
        <td>Nota Baja</td>
        <td>{{ nota_baja }}</td>
      </tr>
      <tr>
        <td style="font-weight: bold;">Promedio</td>
        <td>{{promedio}}</td>
      </tr>
    </table>
  </body>
</html>
