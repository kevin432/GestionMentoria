<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios | KevOnline</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            align-items: start;
        }

        /* Sección Formulario */
        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--white);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        button:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Sección Lista de Usuarios */
        .users-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .user-card {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
            animation: slideIn 0.3s ease-out;
        }

        .user-card:hover {
            transform: scale(1.02);
            border-color: var(--primary);
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .user-info {
            flex-grow: 1;
        }

        .user-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
        }

        .user-age {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .age-badge {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            color: var(--primary);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 768px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Columna Formulario -->
        <div class="card">
            <h1><span>👤</span> Usuarios</h1>
            <p class="subtitle">Registra nuevos miembros en el sistema.</p>

            <form method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input placeholder="Ej: Kevin Smith" type="text" name="nombre" id="nombre" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="edad">Edad (5 - 100)</label>
                    <input placeholder="Ej: 25" type="number" name="edad" id="edad" min="5" max="100">
                </div>

                <button id="guardar" disabled>
                    <span>Guardar Usuario</span>
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </form>
        </div>

        <!-- Columna Resultados -->
        <div class="users-section">
            <h2 style="font-size: 1.1rem; margin-bottom: 10px; padding-left: 5px;">Lista de Miembros</h2>
            
            {% for i in usuarios %}
            <div class="user-card">
                <div class="avatar">
                    {{ i.nombre[0] | upper }}
                </div>
                <div class="user-info">
                    <div class="user-name">{{ i.nombre }}</div>
                    <div class="user-age">Registrado con <span class="age-badge">{{ i.edad }} años</span></div>
                </div>
            </div>
            {% else %}
            <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                <p>No hay usuarios registrados aún.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function(){
            const nombre = document.getElementById("nombre");
            const edad = document.getElementById("edad");
            const btn = document.getElementById("guardar");

            function validar(){
                const n = nombre.value.trim();
                const e = edad.value;

                // Validación: nombre >= 3 caracteres y edad entre 5 y 100
                const esNombreValido = n.length >= 3;
                const esEdadValida = e !== "" && parseInt(e) >= 5 && parseInt(e) <= 100;

                btn.disabled = !(esNombreValido && esEdadValida);
            }

            // Usamos "input" para detectar cualquier cambio (teclado, pegado, flechas de número)
            nombre.addEventListener("input", validar);
            edad.addEventListener("input", validar);

            validar();
        });
    </script>
</body>
</html>
