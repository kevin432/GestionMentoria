<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <style>
        /* Modern CSS Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        /* Profile Card Container */
        .profile-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 350px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .profile-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* Top Decorative Header */
        .header-bg {
            height: 120px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
        }

        /* Profile Image Section */
        .profile-image-container {
            margin-top: -60px;
            position: relative;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            background-color: #fff;
            border-radius: 50%;
            padding: 5px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .profile-image img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #eee;
        }

        /* Information Section */
        .content {
            padding: 20px 30px 40px;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .age {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .age::before {
            content: "•";
            color: #4facfe;
            font-weight: bold;
        }

        /* Career Badge */
        .career-container {
            margin-top: 15px;
        }

        .career-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b2bec3;
            margin-bottom: 8px;
            display: block;
        }

        .career-value {
            background-color: #f0f2f5;
            color: #4facfe;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            display: inline-block;
            border: 1px solid #e1e4e8;
        }

        /* Buttons/Social (Optional extras for a complete look) */
        .actions {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background-color: #4facfe;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Fondo decorativo superior -->
        <div class="header-bg"></div>
        
        <!-- Foto de Perfil -->
        <div class="profile-image-container">
            <div class="profile-image">
                <!-- Avatar de ejemplo (Placeholder) -->
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Foto de Perfil">
            </div>
        </div>

        <div class="content">
            <!-- Nombre -->
            <h1 class="name">{{nombre}}</h1>
            
            <!-- Edad -->
            <p class="age">{{edad}} años de edad</p>
            
            <!-- Carrera -->
            <div class="career-container">
                <span class="career-label">Carrera</span>
                <span class="career-value">{{carrera}}</span>
            </div>

            <!-- Botones de acción -->
            <div class="actions">
                <a href="#" class="btn btn-primary">Contactar</a>
            </div>
        </div>
    </div>

</body>
</html>
