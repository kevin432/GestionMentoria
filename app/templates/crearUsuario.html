<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Registro</title>
    <style>
      /* Estilos base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Contenedor del Formulario */
      .form-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 450px;
      }

      .form-card h2 {
        color: #2d3748;
        margin-bottom: 10px;
        font-size: 1.5rem;
        text-align: center;
      }

      .form-card p {
        color: #718096;
        font-size: 0.9rem;
        text-align: center;
        margin-bottom: 30px;
      }

      /* Grupos de Input */
      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        color: #4a5568;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .input-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
        font-family: inherit;
      }

      .input-group input:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
      }

      /* Botón de envío */
      .submit-btn {
        width: 100%;
        background-color: #4a90e2;
        color: white;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background-color: #357abd;
      }

      .submit-btn:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="form-card">
      <h2>Crear Cuenta</h2>
      <p>Por favor, ingresa tus datos para registrarte.</p>

      <form id="crear_user">
        <!-- Input de Nombre -->
        <div class="input-group">
          <label for="nombre">Nombre Completo</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Tu nombre"
            required
          />
        </div>

        <!-- Input de Email -->
        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ejemplo@correo.com"
            required
          />
        </div>

        <!-- Input de Password -->
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Tu contraseña"
            required
          />
        </div>

        <!-- Botón -->
        <button type="submit" class="submit-btn">Registrarse</button>
      </form>
    </div>
  </body>
  <script src="{{ url_for('static', filename='js/public/jquery-4.0.0.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/crearUsuario.js') }}"></script>
</html>
