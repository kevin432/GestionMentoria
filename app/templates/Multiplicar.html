<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Multiplicar del {{n}}</title>
</head>
<body>
    <ul>
        {% for i in range(1, 11) %}
        <li>
            {{i}} X {{n}} = {{i*n}}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
