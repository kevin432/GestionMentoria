<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Notas de Estudiantes</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Contenedor de la tabla */
        .table-container {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 600px;
        }

        .table-header {
            background-color: #4a90e2;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .table-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        /* Estilos de la tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: #666;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Efecto hover en las filas */
        tr:hover {
            background-color: #f1f7ff;
            transition: background-color 0.2s ease;
        }

        /* Estilo para las notas (badges) */
        .nota {
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }

        .aprobado {
            color: #2ecc71;
            background-color: #eafaf1;
        }

        .reprobado {
            color: #e74c3c;
            background-color: #fdedec;
        }

        /* Responsivo para móviles */
        @media (max-width: 480px) {
            th, td {
                padding: 12px 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="table-container">
        <div class="table-header">
            <h2>Registro de Calificaciones</h2>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Estudiante</th>
                    <th>Materia</th>
                    <th>Nota Final</th>
                </tr>
            </thead>
            <tbody>
                {% for i in estudiantes %}
                <tr>
                    
                    <td>{{i.nombre}}</td>
                    <td>{{i.materia}}</td>
                    {% if i.nota <= 5 %}
                    <td <span class="nota reprobado">{{i.nota}}</span></td>
                    {%else%}
                    <td <span class="nota aprobado">{{i.nota}}</span></td>
                    {% endif%}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
